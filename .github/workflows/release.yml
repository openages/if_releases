name: Release

on:
      workflow_dispatch:
            inputs:

jobs:
      build_and_release:
            permissions:
                  contents: write

            strategy:
                  fail-fast: false
                  matrix:
                        include:
                              - platform: macos-latest
                                args: '--target x86_64-apple-darwin'
                                name: MacOS (Intel)
                              - platform: 'windows-latest'
                                args: ''
                                name: Windows (x64)

            name: ${{ matrix.name }}
            runs-on: ${{ matrix.platform }}
            outputs:
                  version: ${{ steps.version.outputs.value }}
            steps:
                  - name: Check out project
                    uses: actions/checkout@v4
                    with:
                          repository: openages/if_electron
                          token: ${{ secrets.IF_ELECTRON_ACCESS_TOKEN }}
                          ref: master

                  - name: setup node
                    uses: actions/setup-node@v4
                    env:
                          NODE_OPTIONS: '--max_old_space_size=4096'
                    with:
                          node-version: 23.5.0

                  - name: Setup python
                    uses: actions/setup-python@v4
                    with:
                          python-version: 3.9

                  - name: Setup pnpm
                    uses: pnpm/action-setup@v4
                    with:
                          version: 9

                  - name: Get version
                    id: version
                    shell: bash
                    run: |
                          VERSION=$(node -p "require('./package.json').version")
                          echo "app_version=$VERSION" >> $GITHUB_ENV
                          echo "value=$VERSION" >> $GITHUB_OUTPUT

                  - name: Show version
                    shell: bash
                    run: echo "App version is v$app_version"

                  - name: Install deps
                    run: pnpm install

                  - name: MacOS:Import Apple Certificate (Developer ID)
                    if: matrix.platform == 'macos-latest'
                    env:
                          APPLE_CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE }}
                          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_PASSWORD }}
                          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
                    run: |
                          echo $APPLE_CERTIFICATE | base64 --decode > certificate.p12
                          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
                          security default-keychain -s build.keychain
                          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
                          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
                          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
                          security find-identity -v -p codesigning build.keychain

                  - name: MacOS:Build and upload
                    if: matrix.platform == 'macos-latest'
                    run: pnpm run release:mac

                  - name: MacOS:Upload to artifact
                    if: matrix.platform == 'macos-latest'
                    uses: actions/upload-artifact@v4
                    with:
                          name: macos_artifact
                          compression-level: 0
                          path: release/**/*.dmg

                  - name: Windows:Build
                    if: matrix.platform == 'windows-latest'
                    run: |
                          pnpm run id:win
                          pnpm run clean_win_release

                  - name: Windows:Upload to r2
                    if: matrix.platform == 'windows-latest'
                    uses: ryand56/r2-upload-action@latest
                    with:
                          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
                          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
                          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
                          r2-bucket: ${{ secrets.R2_BUCKET }}
                          source-dir: release/win32/x64
                          destination-dir: release/win32/x64

                  - name: Windows:Upload to artifact
                    if: matrix.platform == 'windows-latest'
                    uses: actions/upload-artifact@v4
                    with:
                          name: windows_artifact
                          compression-level: 0
                          path: |
                                release/**/IF-*.exe
                                !release/**/*.blockmap

      github_release:
            runs-on: ubuntu-latest
            needs: build_and_release
            steps:
                  - name: Download artifact
                    uses: actions/download-artifact@v4
                    with:
                          path: artifacts
                          merge-multiple: true

                  - name: List artifacts directory
                    run: ls -R ./artifacts/

                  - name: Make github release
                    uses: softprops/action-gh-release@v2
                    with:
                          body: "[Read IF v${{ needs.build_and_release.outputs.version }}'s release notes](https://if.openages.com/changelog)"
                          tag_name: v${{ needs.build_and_release.outputs.version }}
                          files: artifacts/**
